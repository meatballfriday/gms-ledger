<title>The GM's Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@400&display=swap">
<style>
/* Layout: a production traveler. Each module is a job card that moves down the line; ledger figures sit in mono with accounting brackets and double-ruled totals. */
:root{
  --paper:#F1F4F2; --card:#FFFFFF; --ink:#16232A; --muted:#55666B; --rule:#D3DCD7; --rule-strong:#A9B8B2;
  --accent:#0C6A61; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA;
  --amber:#8F5A0E; --amber-soft:#FAF0DB; --amber-line:#E2C48A;
  --red:#B42318; --red-soft:#FCE9E6;
  --good:#2B7739; --good-soft:#E1F1E3;
  --blue:#2A5A9B; --blue-soft:#E3EBF7;
  --quiz:#5B4B8A; --quiz-soft:#ECE8F6;
  --track:#E3E9E6;
  --lg-paper:#F7FAF4; --lg-edge:#C9D8CC; --lg-rule:#CFE0D3; --lg-col:#B9D0C0; --lg-red:#C24A3A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --q0:#C9D2CE; --q1:#F2B8A8; --q2:#E58466; --q3:#CC4F33; --q4:#9C2F1C;
  --shadow:0 1px 2px rgba(16,40,40,.06),0 6px 18px rgba(16,40,40,.05);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-hand:'Kalam','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F171A; --card:#162126; --ink:#E3ECEA; --muted:#97A9AC; --rule:#283a3f; --rule-strong:#47605F;
    --accent:#4CC0B2; --accent-ink:#06201D; --accent-soft:#11312D;
    --amber:#E3AA4E; --amber-soft:#33270F; --amber-line:#6B5221;
    --red:#F2877C; --red-soft:#3A1916;
    --good:#7CCB8B; --good-soft:#163120;
    --blue:#8FB5EC; --blue-soft:#172941;
    --quiz:#B8A8EE; --quiz-soft:#261F3F;
    --track:#22323A;
    --lg-paper:#152126; --lg-edge:#2C3E42; --lg-rule:#22353A; --lg-col:#2F474B; --lg-red:#E07B6C;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --q0:#3A4A4F; --q1:#6B2A1F; --q2:#A23B27; --q3:#D2593F; --q4:#F08A6E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0F171A; --card:#162126; --ink:#E3ECEA; --muted:#97A9AC; --rule:#283a3f; --rule-strong:#47605F;
    --accent:#4CC0B2; --accent-ink:#06201D; --accent-soft:#11312D;
    --amber:#E3AA4E; --amber-soft:#33270F; --amber-line:#6B5221;
    --red:#F2877C; --red-soft:#3A1916;
    --good:#7CCB8B; --good-soft:#163120;
    --blue:#8FB5EC; --blue-soft:#172941;
    --quiz:#B8A8EE; --quiz-soft:#261F3F;
    --track:#22323A;
    --lg-paper:#152126; --lg-edge:#2C3E42; --lg-rule:#22353A; --lg-col:#2F474B; --lg-red:#E07B6C;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --q0:#3A4A4F; --q1:#6B2A1F; --q2:#A23B27; --q3:#D2593F; --q4:#F08A6E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 8px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.brand-mark{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:3px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;line-height:1;flex:none}
.brand-mark span{padding:4px 4px 3px}
.brand-mark span+span{border-left:1.5px solid var(--ink)}
.brand-name{font-family:var(--f-display);font-weight:850;font-stretch:78%;font-size:19px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand-ed{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-tools{display:flex;align-items:center;gap:10px;flex:none}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;line-height:1.2;white-space:nowrap}
.lang-btn{position:relative;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:0 4px 0 8px;line-height:1.2;white-space:nowrap}
.lang-btn svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5}
.lang-btn select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-size:12.5px;font-weight:600;padding:4px 6px 4px 0;cursor:pointer;border-radius:999px}
.lang-btn select:focus-visible{outline:none}
.lang-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.lang-btn select option{color:#111;background:#fff}
.theme-btn .sw{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.brand-name{white-space:nowrap}
@media (max-width:440px){.prog-bar{display:none}.brand-name{font-size:17px}.brand-ed{max-width:140px}.top-tools{gap:6px}.theme-btn{padding:4px 8px}}
.prog{display:flex;align-items:center;gap:8px;flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prog-bar{width:72px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:1100px;margin:0 auto;scrollbar-width:thin;scroll-padding-inline:16px}
.strip-part{flex:none;align-self:center;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 2px 0 8px;white-space:nowrap}
.strip-part:first-child{padding-left:0}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 11px 5px 6px;font-size:13.5px;cursor:pointer;white-space:nowrap;line-height:1.2}
.chip .n{font-family:var(--f-mono);font-size:11.5px;font-weight:600;min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:var(--track);color:var(--ink)}
.chip.is-done .n{background:var(--good);color:var(--card)}
.chip.is-soon{border-style:dashed;color:var(--muted);background:transparent}
.chip.is-active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.is-active .n{background:var(--accent-ink);color:var(--accent)}
.chip.plain{padding-left:11px}

/* ---------- page */
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:22px 96px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(30px,6.4vw,44px);font-weight:850;font-stretch:82%;letter-spacing:-.005em}
h2{font-size:clamp(23px,4.4vw,29px);font-weight:800;font-stretch:85%}
h3{font-size:19px;font-weight:750;font-stretch:90%}
h4{font-size:16px;font-weight:750}
.lede{font-size:18.5px;color:var(--muted);max-width:62ch;margin:10px 0 0}
.mod-head{display:grid;gap:8px;margin-bottom:18px}
.mod-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.goals{margin:8px 0 0;padding:14px 18px 14px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.goals h4{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px}
.goals ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.goals li{position:relative;padding-left:24px}
.goals li::before{content:'';position:absolute;left:2px;top:.55em;width:11px;height:6px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}

/* section tabs */
.sectabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;margin:14px 0 6px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.sectab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1.2}
.sectab .k{width:8px;height:8px;border-radius:50%;flex:none;background:var(--kc)}
.sectab .sn{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sectab.is-active{border-color:var(--kc);box-shadow:inset 0 -3px 0 var(--kc);font-weight:700}
.sectab.is-done .sn::after{content:" ✓";color:var(--good)}
[data-kind="learn"]{--kc:var(--accent)}
[data-kind="play"]{--kc:var(--blue)}
[data-kind="case"]{--kc:var(--amber)}
[data-kind="quiz"]{--kc:var(--quiz)}
[data-kind="apply"]{--kc:var(--good)}
.sec-head{display:grid;gap:4px;margin:18px 0 12px}
.kind{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--kc);font-weight:600}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc)}
.blocks{display:grid;gap:18px}
.prose{max-width:68ch;min-width:0}
.prose>*:first-child{margin-top:0}
.prose>*:last-child{margin-bottom:0}
.prose p{margin:0 0 12px}
.prose h3{margin:22px 0 8px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:4px 0}
.prose strong{font-weight:700}
.prose em{font-style:italic}
.prose .muted{color:var(--muted)}
.term{font-weight:700;border-bottom:1.5px dotted var(--accent)}
.term.auto{font-weight:inherit;border-bottom:1px dotted var(--accent)}
.neg{color:var(--red)}
.pos{color:var(--good)}
.small{font-size:14px}

/* financial statements */
.fs-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table.fs{width:100%;border-collapse:collapse;font-size:15px}
table.fs caption{caption-side:top;text-align:left;padding:12px 14px 8px;font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:16.5px;border-bottom:1px solid var(--rule)}
table.fs caption small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
table.fs th,table.fs td{padding:6px 14px;text-align:left;vertical-align:top}
table.fs thead th{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--rule)}
table.fs tbody th{font-weight:400;min-width:150px}
table.fs td.v,table.fs th.v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.fs tr.grp th{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:12px;font-weight:600}
table.fs tr.ind th{padding-left:30px}
table.fs tr.sub th{font-weight:700}
table.fs tr.sub td.v{border-top:1px solid var(--rule-strong);font-weight:600}
table.fs tr.total th{font-weight:700}
table.fs tr.total td.v{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:600}
table.fs tr.hl th,table.fs tr.hl td{background:var(--amber-soft)}
table.fs tr.muted th,table.fs tr.muted td{color:var(--muted)}
table.fs tr:last-child th,table.fs tr:last-child td{padding-bottom:12px}
.fs-note{font-size:13.5px;color:var(--muted);margin:6px 2px 0}
table.grid{width:100%;border-collapse:collapse;font-size:14.5px}
table.grid th,table.grid td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.grid thead th{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.grid td.v,table.grid th.v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.tbl table.grid tr:last-child td{border-bottom:0}

/* callouts */
.co{position:relative;border-radius:10px;padding:14px 16px;background:var(--cs);color:var(--ink);min-width:0}
.co-label{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--cc);font-weight:600;margin-bottom:4px}
.co h4{margin:0 0 6px;font-size:17px}
.co .prose{max-width:none}
.co.key{--cs:var(--accent-soft);--cc:var(--accent)}
.co.tip{--cs:transparent;--cc:var(--muted);border:1px solid var(--rule)}
.co.flag{--cs:var(--red-soft);--cc:var(--red)}
.co.report{--cs:var(--blue-soft);--cc:var(--blue)}
.co.case{--cs:var(--amber-soft);--cc:var(--amber);border:1px solid var(--amber-line);border-top-left-radius:0;margin-top:16px}
.co.case .co-label{position:absolute;top:-23px;left:-1px;background:var(--amber-soft);border:1px solid var(--amber-line);border-bottom:0;border-radius:7px 7px 0 0;padding:3px 12px 2px;margin:0}
.co.case::after{content:"";position:absolute;top:-1px;left:0;width:118px;height:2px;background:var(--amber-soft)}

/* quiz */
.quiz{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.quiz-tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--quiz);font-weight:600}
.quiz-q p{margin:4px 0 0;font-weight:700;font-size:17px;line-height:1.45}
.quiz-opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;line-height:1.45}
.opt .ol{font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--rule-strong);display:grid;place-items:center;margin-top:1px}
.opt:hover:not(:disabled){border-color:var(--quiz)}
.opt:disabled{cursor:default}
.opt.is-right{background:var(--good-soft);border-color:var(--good)}
.opt.is-right .ol{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.is-wrong{background:var(--red-soft);border-color:var(--red)}
.opt.is-wrong .ol{background:var(--red);border-color:var(--red);color:var(--card)}
.opt.is-dim{opacity:.6}
.quiz-why{border-top:1px dashed var(--rule-strong);padding-top:10px}
.quiz-why p{margin:0 0 6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.flip{display:grid;align-content:start;gap:6px;text-align:left;min-height:128px;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:14px;cursor:pointer;line-height:1.45}
.flip .ff{font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:18px;line-height:1.2}
.flip .fh{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.flip .fb{display:none;font-size:15px}
.flip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.flip[aria-pressed="true"] .fb{display:block}
.flip[aria-pressed="true"] .fh{display:none}

/* sort game */
.sort{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:16px;display:grid;gap:4px;min-width:0}
.sort-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.sort-head p{margin:0;font-weight:700}
.sort-score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sort-item{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--rule)}
.sort-text{font-size:15.5px}
.sort-btns{display:flex;flex-wrap:wrap;gap:6px}
.sb{border:1px solid var(--rule-strong);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.sb:hover:not(:disabled){border-color:var(--accent)}
.sb:disabled{cursor:default}
.sb.is-right{background:var(--good);border-color:var(--good);color:var(--card)}
.sb.is-wrong{background:var(--red);border-color:var(--red);color:var(--card)}
.sb.is-ans{border-color:var(--good);border-width:2px}
.sort-fb{font-size:14px;color:var(--muted)}

/* checklist */
.check{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:14px 16px;min-width:0}
.check h4{margin-bottom:8px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--rule);cursor:pointer;line-height:1.45}
.check label:first-of-type{border-top:0}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--good)}
.check-count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}

/* widgets */
.widget{border:1px solid var(--rule);background:var(--card);border-radius:12px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.w-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--blue-soft)}
.w-head .kind{--kc:var(--blue);white-space:nowrap;flex:none}
.w-ico{width:18px;height:18px;flex:none;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round}
.w-ico circle{fill:var(--card)}
.w-head h4{font-size:16px}
.w-body{padding:16px;display:grid;gap:14px;min-width:0}
.w-body>*,.blocks>*{min-width:0}
.w-hint{margin:0;color:var(--muted);font-size:14.5px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:2px}
.ctrl output{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{border:1px solid var(--rule);border-radius:9px;padding:9px 12px;background:var(--paper);min-width:0}
.stat-l{font-size:12.5px;color:var(--muted);line-height:1.3}
.stat-v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.3;margin-top:2px}
.stat-s{font-size:12px;color:var(--muted)}
.stat.good{border-color:var(--good);background:var(--good-soft)}
.stat.bad{border-color:var(--red);background:var(--red-soft)}
.stat.warn{border-color:var(--amber-line);background:var(--amber-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.toc{position:fixed;inset:0;z-index:70}
.toc-scrim{position:absolute;inset:0;background:rgba(10,20,22,.42)}
.toc-panel{position:absolute;top:0;left:0;bottom:0;width:min(420px,100%);background:var(--paper);display:flex;flex-direction:column;box-shadow:12px 0 32px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px)}
.toc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--rule)}
.toc-head h2{font-size:22px}
.toc-x{border:1px solid var(--rule-strong);background:var(--card);color:var(--ink);border-radius:8px;width:36px;height:36px;font-size:15px;cursor:pointer}
.toc-body{flex:1;overflow:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;align-content:start}
.toc-prog{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
.toc-prog-t{font-size:14.5px}
.toc-bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.toc-bar i{display:block;height:100%;background:var(--good);border-radius:4px}
.toc-resume{justify-self:start;white-space:normal;text-align:left}
.toc-part{display:grid;gap:2px}
.toc-part h3{font-size:13.5px;color:var(--muted);font-weight:700;margin:0 0 4px}
.toc-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1.3}
.toc-row:hover{background:var(--card)}
.toc-row.is-cur{background:var(--accent-soft);font-weight:700}
.toc-n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--track);font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.toc-row.is-done .toc-n{background:var(--good);color:var(--card)}
.toc-row.is-cur .toc-n{background:var(--accent);color:var(--accent-ink)}
.toc-home .toc-n{font-family:inherit;font-size:15px}
.toc-s{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.toc-mini{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--track);overflow:hidden;vertical-align:middle}
.toc-mini i{display:block;height:100%;background:var(--accent)}
.toc-disp{gap:10px}
.toc-set{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px}
.seg2{display:inline-flex;border:1px solid var(--rule-strong);border-radius:999px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;background:none;color:var(--ink);padding:6px 12px;font-size:13.5px;cursor:pointer}
.seg2 button+button{border-left:1px solid var(--rule)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
body.toc-open{overflow:hidden}
@media (prefers-reduced-motion: no-preference){ .toc-panel{animation:tocin .22s ease-out} .toc-scrim{animation:tocfade .22s ease-out} @keyframes tocin{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}} @keyframes tocfade{from{opacity:0}to{opacity:1}} }
/* larger text */
html[data-size="lg"] .wrap{zoom:1.12}
/* home resume card */
#hero-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.resume{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:14px 16px;border:1px solid var(--accent);border-radius:12px;background:var(--card)}
.resume-t{display:grid;gap:2px;min-width:0}
.resume-k{font-size:13px;color:var(--accent);font-weight:700}
.resume-t strong{font-family:var(--f-display);font-size:19px;line-height:1.25}
.resume-t span:last-child{font-size:14px;color:var(--muted)}
/* end-of-module status */
.modend{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:26px;padding:14px 16px;border:1px solid var(--rule-strong);border-radius:12px;background:var(--card)}
.modend.is-done{border-color:var(--good);background:var(--good-soft)}
.modend-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--track);color:var(--ink)}
.modend.is-done .modend-ic{background:var(--good);color:var(--card);font-size:20px}
.modend-t{flex:1 1 260px;display:grid;gap:3px;font-size:15px;min-width:0}
.modend-t strong{font-family:var(--f-display);font-size:17px}
.modend-l{display:flex;flex-wrap:wrap;gap:4px 14px}
.brand{flex:1 1 auto}
.brand>span:last-child{min-width:0;overflow:hidden}
.brand-name{display:block;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){ .bn-the{display:none} .brand-name{font-size:16px} }
details.goals summary{list-style:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;cursor:pointer}
details.goals summary::-webkit-details-marker{display:none}
details.goals summary h4{margin:0}
details.goals .g-n{font-size:13px;color:var(--muted);white-space:nowrap}
details.goals[open] .g-n{display:none}
details.goals:not([open]) summary h4::after{content:' +';color:var(--accent)}
details.goals[open] summary{margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tmpl{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.tmpl-h{display:flex;gap:12px;align-items:flex-start}
.tmpl-h svg{flex:none;width:38px;height:38px;padding:8px;border-radius:10px;background:var(--accent-soft);fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tmpl h4{margin:0;font-size:16.5px}
.tmpl-f{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.tmpl p{margin:0;font-size:14.5px}
.tmpl-m{margin:0;display:grid;gap:4px;font-size:13.5px}
.tmpl-m div{display:grid;grid-template-columns:70px 1fr;gap:6px}
.tmpl-m dt{color:var(--muted)}
.tmpl-m dd{margin:0}
.tmpl-m .linkbtn{font-size:13.5px;text-align:left}
.tmpl-a{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:4px}
.tmpl-s{color:var(--muted)}
.qb{display:grid;gap:10px}
.qb-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qb-bar .search{flex:1 1 220px;width:auto}
.qb .qb-t button{font-family:inherit;font-size:13px}
.qb-s:empty{display:none}
.qb-s{color:var(--muted)}
.qb-g{margin-top:8px}
.qb-g h4{margin:0 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.qb-q{border:1px solid var(--rule);background:var(--card);border-radius:10px;margin-bottom:6px}
.qb-q summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px;list-style-position:outside;margin-left:16px;padding-left:2px}
.qb-q[open] summary{border-bottom:1px solid var(--rule)}
.qb-a{padding:10px 14px 12px;font-size:14.5px}
.qb-a p{margin:0 0 8px}
.qb-ok,.qb-no{display:inline-block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-right:8px;padding:1px 7px;border-radius:5px}
.qb-ok{color:var(--good);border:1px solid var(--good)}
.qb-no{color:var(--red);border:1px solid var(--red)}
.az{display:flex;flex-wrap:wrap;gap:4px}
.az button{min-width:32px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:7px;padding:4px 7px;font-family:var(--f-mono);font-size:12.5px;cursor:pointer}
.az button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.g-aka{font-size:13px;color:var(--muted);margin-top:4px}
.g-links{font-size:13px;color:var(--muted);margin-top:4px}
.g-links .linkbtn{font-size:13px}
.backpill{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;max-width:calc(100% - 32px);border-radius:999px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.backpill button{border:0;background:var(--ink);color:var(--paper);font:inherit;cursor:pointer}
.bp-go{display:flex;align-items:center;gap:8px;padding:11px 6px 11px 16px;font-weight:700;font-size:14px;min-width:0}
.bp-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-x{padding:10px 15px 10px 10px;font-size:19px;line-height:1;opacity:.7}
.bp-x:hover{opacity:1}
@media (prefers-reduced-motion: no-preference){ .backpill:not([hidden]){animation:bpin .25s ease-out} @keyframes bpin{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}} }
/* ---------- figures, charts, diagrams */
.fig{margin:0;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:14px 16px 12px;display:grid;gap:10px;min-width:0}
.fig-t{font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:16.5px;line-height:1.25}
.fig figcaption{font-size:13.5px;color:var(--muted);line-height:1.45;max-width:68ch}
.fig-body{min-width:0;position:relative}
.fig-scroll{overflow-x:auto}
.v-svg{display:block;max-width:100%;height:auto;overflow:visible}
.fig-scroll .v-svg{max-width:none}
.v-svg text{fill:var(--ink);font-family:var(--f-body)}
.v-t{font-size:13px;font-weight:700}
.v-s{font-size:11.5px;fill:var(--muted)!important}
.v-l{font-size:11px;fill:var(--muted)!important;font-family:var(--f-mono)!important}
.v-ax{font-size:11px;fill:var(--muted)!important;font-family:var(--f-mono)!important}
.v-big{font-size:22px;font-weight:800;font-family:var(--f-mono)!important}
.v-val{font-size:11.5px;font-family:var(--f-mono)!important;font-weight:600}
.v-node{fill:var(--card);stroke:var(--rule-strong);stroke-width:1.2}
.v-node.alt{fill:var(--paper)}
.v-node.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.v-node.bad{fill:var(--red-soft);stroke:var(--red)}
.v-node.good{fill:var(--good-soft);stroke:var(--good)}
.v-node.warn{fill:var(--amber-soft);stroke:var(--amber-line)}
.v-edge{stroke:var(--muted);stroke-width:1.5;fill:none}
.v-head{fill:var(--muted)}
.v-edge.bad{stroke:var(--red)} .v-head.bad{fill:var(--red)}
.v-edge.acc{stroke:var(--accent)} .v-head.acc{fill:var(--accent)}
.v-grid{stroke:var(--rule);stroke-width:1}
.v-zero{stroke:var(--rule-strong);stroke-width:1.2}
.v-ref{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.v-ref.bad{stroke:var(--red)}
.v-band{fill:var(--red-soft)}
.v-ring{stroke:var(--rule-strong);stroke-width:1.2;fill:none;stroke-dasharray:3 5}
.v-badge{fill:var(--ink)} .v-badge-t{fill:var(--paper)!important;font-size:11px;font-weight:700;font-family:var(--f-mono)!important}
.v-line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.v-c-s1{stroke:var(--s1)} .v-c-s2{stroke:var(--s2)} .v-c-s3{stroke:var(--s3)} .v-c-s4{stroke:var(--s4)}
.v-c-good{stroke:var(--good)} .v-c-red{stroke:var(--red)} .v-c-muted{stroke:var(--rule-strong)} .v-c-ink{stroke:var(--ink)} .v-c-acc{stroke:var(--accent)}
.v-f-s1{fill:var(--s1)} .v-f-s2{fill:var(--s2)} .v-f-s3{fill:var(--s3)} .v-f-s4{fill:var(--s4)}
.v-f-good{fill:var(--good)} .v-f-red{fill:var(--red)} .v-f-muted{fill:var(--rule-strong)} .v-f-ink{fill:var(--ink)} .v-f-acc{fill:var(--accent)}
.v-f-q0{fill:var(--q0)} .v-f-q1{fill:var(--q1)} .v-f-q2{fill:var(--q2)} .v-f-q3{fill:var(--q3)} .v-f-q4{fill:var(--q4)}
.v-area{opacity:.12}
.v-hit{fill:transparent;cursor:crosshair}
.v-hit:hover{fill:var(--ink);fill-opacity:.05}
.v-dot{stroke:var(--card);stroke-width:2}
.v-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.v-legend span{display:inline-flex;align-items:center;gap:6px}
.v-legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.v-legend i.sq{width:11px;height:11px;border-radius:3px}
.v-legend i.dash{height:0;border-top:2px dashed var(--muted);background:none!important}
.v-data summary{cursor:pointer;font-size:13px;color:var(--accent);margin-top:2px}
.v-data .tbl{margin-top:8px}
/* stacked bars */
.stk{display:grid;gap:10px}
.stk-row{display:grid;grid-template-columns:minmax(80px,24%) 1fr;gap:10px;align-items:center}
.stk-row.nolabel{grid-template-columns:1fr}
.stk-l{font-size:13.5px;line-height:1.3}
.stk-l small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.stk-bar{display:flex;gap:2px;height:30px;min-width:0}
.stk-seg{height:100%;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;min-width:2px}
.stk-seg.light{color:#16232A}
.stk-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.stk-key span{display:inline-flex;align-items:center;gap:6px}
.stk-key i{width:11px;height:11px;border-radius:3px;display:inline-block}
.stk-key b{font-family:var(--f-mono);font-weight:600;font-size:12.5px}
/* stepper */
.st-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.st-ctl .st-n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.st-cap{background:var(--accent-soft);border-radius:9px;padding:10px 12px;font-size:15px;line-height:1.5;min-height:3.2em}
.st-dim [data-k]{transition:opacity .35s ease}
.st-dim [data-k]:not(.on){opacity:.14}
.st-dim g.on .v-node{stroke:var(--accent);stroke-width:2.2}
.st-dim g.on .v-edge{stroke:var(--accent);stroke-width:2.2}
.st-dim g.on .v-head{fill:var(--accent)}
.st-dim g.on .v-badge{fill:var(--accent)}
/* tooltip */
.vtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.vtip b{display:block;font-weight:700;margin-bottom:2px}
[data-tip]{cursor:default}
/* bucket */
.bucket-wrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:520px){.bucket-wrap{grid-template-columns:1fr}}
@media (prefers-reduced-motion: no-preference){
  .st-dim g.on .v-edge{stroke-dasharray:7 5;animation:vmarch .9s linear infinite}
  @keyframes vmarch{to{stroke-dashoffset:-24}}
  .v-spin{animation:vspin 16s linear infinite}
  @keyframes vspin{to{transform:rotate(360deg)}}
  .v-pulse{animation:vpulse 2.4s ease-in-out infinite}
  @keyframes vpulse{50%{opacity:.35}}
}

.doc-head{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:baseline;border-top:3px solid var(--ink);border-bottom:1px solid var(--rule-strong);padding:8px 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.doc-head strong{color:var(--ink);font-weight:600}
.doc-text{border-left:3px solid var(--rule-strong);padding:2px 0 2px 14px;max-width:68ch}
.doc-text p{margin:0 0 10px}
.packlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.35}
.packlink .pl-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:2px}
.packlink .pl-a{font-weight:700;color:var(--blue);flex:none}
.packs{display:grid;gap:12px}
.pack-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer;width:100%}
.pack-card:hover{border-color:var(--accent)}
.pack-badge{width:44px;height:52px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-weight:850;font-size:22px;position:relative;background:var(--paper)}
.pack-badge::after{content:"";position:absolute;top:-1.5px;right:-1.5px;width:12px;height:12px;background:var(--card);border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.pack-t{font-weight:700;font-size:16.5px;line-height:1.3}
.pack-s{font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.pack-m{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion: no-preference){
  .sec-body{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}

/* ===== less template, more ledger =====
   Labels are sentence case in the reading face; monospace is kept for figures only.
   Callouts are margin notes with a ruled edge; only the report viewer and dialogs float. */
.eyebrow,.kind,.co-label,.quiz-tag,.strip-part,.brand-ed,.mod-meta,.flip .fh,.ev-p h5,.ev-sub,.qres-h,.warm-tag,.lib-card .lib-co,.qb-g h4,.qb-ok,.qb-no,.packlink .pl-k,table.fs thead th,table.fs tr.grp th,table.grid thead th,.goals h4{font-family:var(--f-body);text-transform:none;letter-spacing:normal}
.eyebrow{font-size:14px;font-weight:700;color:var(--accent)}
.kind{font-size:13.5px;font-weight:700}
.co-label{font-size:14px;font-weight:700}
.quiz-tag{font-size:13.5px;font-weight:700}
.strip-part{font-size:12.5px;font-weight:700}
.brand-ed{font-size:12px;margin-top:2px}
.mod-meta{font-size:14px}
.mod-meta span+span::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--rule-strong);vertical-align:middle;margin-right:14px}
table.fs thead th,table.grid thead th{font-size:13px;font-weight:700}
table.fs tr.grp th{font-size:13.5px;font-weight:700;color:var(--ink)}
.warm-tag{font-size:12.5px}
.qb-g h4{font-size:16px;color:var(--ink)}
.qb-ok,.qb-no{font-size:12.5px}
.packlink .pl-k{font-size:13px;font-weight:700}
.qres-h{font-size:14px}
.chip .n,.sectab .sn,.toc-n,.toc-s,.syl-n,.modend-ic{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.flip .fh{font-size:12.5px}
/* callouts as margin notes */
.co{border-radius:0 10px 10px 0;border-left:3px solid var(--cc)}
.co.tip{border:0;border-left:3px solid var(--rule-strong);background:transparent;padding-block:4px}
.co.case{border-left-width:1px;border-radius:0 10px 10px 10px}
/* fewer floating cards */
.widget,.lib-card,.tmpl{box-shadow:none}
table.fs caption small{font-family:var(--f-body);font-size:13px;letter-spacing:normal}
.prog{font-family:var(--f-body);font-size:13px}
.fm-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fm-presets button{border:1px solid var(--rule-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.fm-presets button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fm-mis{display:flex;gap:8px;align-items:flex-start;margin:8px 0 12px;font-size:15px}
.fm-mis input{margin-top:5px;accent-color:var(--red)}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px}
.fm-grid .fs-wrap{min-width:0}
@media (max-width:420px){ .fm-grid{grid-template-columns:1fr} }
table.fm{font-size:14px}
table.fm td.v{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.fm tr.sub td{font-weight:700;border-top:1px solid var(--rule-strong)}
table.fm tr.tot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}

.dk-tot td{font-weight:700;border-top:1.5px solid #1d2327;border-bottom:3px double #1d2327}

/* ---------- semi-variable labour split (Module 12) */
.spl-ctl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:14px}
.spl-ctl label{grid-column:1 / -1}
.spl-ctl input{width:100%;accent-color:var(--accent)}
.spl-v{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.spl-bar{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:10px 0 4px;background:var(--track)}
.spl-bar span{display:block;height:100%;transition:width .3s}
.spl-bar .fx,.spl-leg i.fx{background:var(--muted)} .spl-bar .vr,.spl-leg i.vr{background:var(--s2)}
.spl-leg{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)} .spl-leg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.spl-t{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}

.spl-t td:not(:first-child){text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.spl-t tr.d td{font-weight:700}
.spl-say{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.5}
.spl-say p{margin:0 0 6px} .spl-say p:last-child{margin:0}
/* ---------- which overheads go into gross margin (Module 6) */
.ovh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ovh-c{border-radius:10px;padding:10px 12px;border:1px solid var(--rule-strong);background:var(--card)}
.ovh-c.in{border-left:4px solid var(--accent)} .ovh-c.out{border-left:4px solid var(--muted)}
.ovh-h{font-weight:700;font-size:14.5px} .ovh-h small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.ovh-c ul{margin:6px 0 0;padding-left:18px;font-size:14px} .ovh-c li{margin:3px 0}
.ovh-pl{margin-top:12px;border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden;font-size:14px}
.ovh-pl>div{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-bottom:1px solid var(--rule)}
.ovh-pl>div:last-child{border-bottom:0}
.ovh-pl small{display:block;font-size:12px;color:var(--muted)}
.ovh-pl b{font-family:var(--f-mono);font-weight:400;font-size:13px;white-space:nowrap;align-self:center}
.ovh-pl .m{box-shadow:inset 4px 0 0 var(--accent)} .ovh-pl .m.o{box-shadow:inset 4px 0 0 var(--muted)}
.ovh-pl .t{background:var(--accent-soft)} .ovh-pl .t span,.ovh-pl .t b{font-weight:700}

<script>
/* ============================== CORE ============================== */
(function(){
'use strict';
const BW = window.BW = { mods:{}, packs:{}, add(m){ BW.mods[m.id]=m; }, addPack(p){ BW.packs[p.id]=p; }, LANG:{}, lang:'en' };
/* Each language's content is loaded into its own registry; switching swaps them in place. */
const LANG_KEYS=['mods','packs','kitExtra','homeFig','homeDiag','warmup','gloss','saveFile'];
BW.beginLang=function(L){ BW.mods={}; BW.packs={}; LANG_KEYS.slice(2).forEach(k=>{ delete BW[k]; }); };
BW.endLang=function(L){ const o={}; LANG_KEYS.forEach(k=>{ o[k]=BW[k]; }); BW.LANG[L]=o; };
BW.useLang=function(L){ if(!BW.LANG[L]) L='en'; Object.assign(BW,BW.LANG[L]); BW.lang=L; applyOutStr(L);
  try{ document.documentElement.lang=L==='zh-TW'?'zh-Hant-TW':'en'; }catch(e){}
  (BW.langHooks||[]).forEach(f=>{ try{ f(L); }catch(e){ console.error(e); } }); };
/* Interface strings: BW.T(english, {vars}) returns the current language's catalog entry (src/ui_strings.js), or the
   English text when there is none, with {name} placeholders filled in. This fallback is replaced by ui_strings.js. */
const fillVars=(s,v)=>v?String(s).replace(/\{(\w+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(v,k)?v[k]:m):s;
BW.T=BW.T||function(s,v){ return fillVars(s,v); };
const T=(s,v)=>BW.T(s,v);
BW.langHooks=[]; BW.onLang=f=>{ BW.langHooks.push(f); };
BW.LANGS=[['en','EN','English'],['zh-TW','繁中','繁體中文']];

/* ---------- number formatting (accounting style: negatives in brackets) */
const money=(n,d=0)=>{ if(n===null||n===undefined||isNaN(n)) return '–'; const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return n<0?'($'+s+')':'$'+s; };
const num=(n,d=0)=>{ if(n===null||n===undefined||isNaN(n)) return '–'; const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return n<0?'('+s+')':s; };
const signed=(n,d=0)=> n>0?'+'+money(n,d):money(n,d);
const pct=(x,d=1)=>{ if(x===null||x===undefined||isNaN(x)||!isFinite(x)) return '–'; const s=Math.abs(x*100).toFixed(d)+'%'; return x<0?'('+s+')':s; };
const kfmt=n=>{ const a=Math.abs(n); let s; if(a>=1e6) s='$'+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,'')+'M'; else if(a>=1e3) s='$'+(a/1e3).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'k'; else s='$'+a.toFixed(0); return n<0?'('+s+')':s; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- content helpers for module files */
const H = BW.h = {
  money,num,signed,pct,kfmt,esc,
  K:(title,html)=>({t:'callout',tone:'key',title,html}),
  TIP:(title,html)=>({t:'callout',tone:'tip',title,html}),
  FLAG:(title,html)=>({t:'callout',tone:'flag',title,html}),
  CASE:(title,html)=>({t:'callout',tone:'case',title,html}),
  REPORT:(title,html)=>({t:'callout',tone:'report',title,html}),
  Q:(q,opts,a,why)=>({t:'quiz',q,opts,a,why}),
  FS:o=>Object.assign({t:'fs'},o),
  FLIP:cards=>({t:'flip',cards}),
  SORT:(prompt,buckets,items)=>({t:'sort',prompt,buckets,items}),
  CHECK:(id,title,items)=>({t:'check',id,title,items}),
  W:(title,render)=>({t:'widget',title,render}),
  TBL:(head,rows,opts={})=>({t:'tbl',head,rows,opts}),
  FIG:(title,caption,x)=>Object.assign({t:'fig',title,caption}, typeof x==='function'?{draw:x}:(typeof x==='string'?{html:x}:x)),
  PACK:(id,page,label)=>({t:'pack',id,page,label}),
};

/* ---------- BraceWorks base-year figures (shared by modules) */
BW.data = {
  pl:{ revenue:1200000, materials:552000, labour:152000, overhead:156000, cogs:860000, gp:340000,
       selling:86000, admin:160000, opex:246000, ebit:94000, interest:14000, fx:6000, pbt:74000, tax:18500, net:55500, dep:38000, ebitda:132000 },
  bs:{ cash:42000, ar:230000, rm:140000, wip:35000, fg:75000, inv:250000, prepay:13000, ca:535000, ppeCost:520000, accDep:210000, ppe:310000, ta:845000,
       ap:95000, accr:30000, stLoan:120000, taxPay:8500, cl:253500, ltLoan:100000, tl:353500, capital:250000, re:241500, equity:491500 },
  cf:{ net:55500, dep:38000, dAR:-30000, dInv:-45000, dAP:10000, dAccr:3000, dTax:1500, cfo:33000, capex:-60000, borrow:40000, repay:-20000, cff:20000, change:-7000, open:49000, close:42000 }
};

/* ---------- widget UI kit */
function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
const UI = BW.ui = {
  el,
  sliders(container,defs,onChange,uid){
    const wrap=el('div','ctrls'); const vals={};
    defs.forEach(d=>{
      const id=uid(d.k); vals[d.k]=d.v; const f=d.f||(x=>x);
      const c=el('div','ctrl');
      c.innerHTML=`<label for="${id}"><span>${d.label}</span><output for="${id}"></output></label><input type="range" id="${id}" min="${d.min}" max="${d.max}" step="${d.step||1}" value="${d.v}">`;
      const inp=c.querySelector('input'), out=c.querySelector('output'); out.textContent=f(d.v);
      inp.addEventListener('input',()=>{ vals[d.k]=parseFloat(inp.value); out.textContent=f(vals[d.k]); onChange(vals); });
      wrap.appendChild(c);
    });
    container.appendChild(wrap); onChange(vals); return vals;
  },
  seg(container,opts,value,onChange){
    const s=el('div','seg'); s.setAttribute('role','group');
    opts.forEach(o=>{ const b=el('button',null,o.label); b.type='button'; b.setAttribute('aria-pressed',String(o.v===value)); b.addEventListener('click',()=>{ s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onChange(o.v); }); s.appendChild(b); });
    container.appendChild(s); return s;
  },
  bars(items,o={}){
    const f=o.fmt||money; const max=o.max||Math.max(...items.map(x=>Math.abs(x.v)))||1;
    return '<div class="bars">'+items.map(x=>`<div class="bar-row" data-tip="${String(x.label).replace(/<[^>]+>/g,'').replace(/"/g,'&quot;')}|${f(x.v)}"><span class="bar-l">${x.label}</span><span class="bar-t"><span class="bar-f ${x.tone||''}" style="width:${Math.max(0,Math.min(100,Math.abs(x.v)/max*100)).toFixed(2)}%"></span></span><span class="bar-v">${f(x.v)}</span></div>`).join('')+'</div>';
  },
  bridge(steps,o={}){
    /* a waterfall: each bar starts where the one above ended; totals are measured from zero.
       A zero line, light gridlines and a money axis give the bar positions a meaning. */
    const f=o.fmt||money; let run=0;
    const segs=steps.map(s=>{ let a,b; if(s.total){a=0;b=s.v;run=s.v;} else {a=run;b=run+s.v;run=b;} return {s,a,b}; });
    let lo=Math.min(0,...segs.map(x=>Math.min(x.a,x.b))), hi=Math.max(0,...segs.map(x=>Math.max(x.a,x.b)));
    if(o.lo!=null) lo=Math.min(lo,o.lo); if(o.hi!=null) hi=Math.max(hi,o.hi);
    const raw=((hi-lo)||1)/5, mag=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw)||10*mag;
    const pad=(hi-lo)*0.03; if(lo<0) lo-=pad; hi+=pad; const span=(hi-lo)||1;
    const P=x=>((x-lo)/span*100).toFixed(2), ticks=[]; for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) ticks.push(Math.round(t));
    const grid=ticks.map(t=>`<span class="br-g${t===0?' z':''}" style="left:${P(t)}%"></span>`).join('');
    const tk=x=>x===0?'0':kfmt(x).replace(/^\((.*)\)$/,'−$1');
    return '<div class="bridge">'+segs.map(({s,a,b},i)=>{ const l=P(Math.min(a,b)), w=Math.abs(b-a)/span*100; const tone=s.total?'tot':(s.v>=0?'up':'down');
      const val=s.vt!=null?s.vt:(s.total?f(s.v):(s.v>=0?'+':'')+f(s.v)), link=i>0&&!s.total&&!/is-ghost/.test(s.cls||'');
      return `<div class="br-row ${s.total?'is-total':''} ${s.cls||''}" data-tip="${String(s.label).replace(/"/g,'&quot;')}|${s.total?f(s.v):(s.v>=0?'+':'')+f(s.v)}"><span class="br-l">${s.label}</span><span class="br-t">${grid}<span class="br-c${link?'':' off'}" style="left:${P(a)}%"></span><span class="br-f ${tone}" style="left:${l}%;width:${Math.max(w,0.8).toFixed(2)}%"></span></span><span class="br-v">${val}</span></div>`; }).join('')+
      `<div class="br-row br-axis" aria-hidden="true"><span class="br-l"></span><span class="br-t">${ticks.map(t=>`<span class="br-tk" style="left:${P(t)}%">${tk(t)}</span>`).join('')}</span><span class="br-v"></span></div></div>`;
  },
  /* a bridge that updates in place, so bars glide to their new positions */
  liveBridge(host,o){ let n=-1; return steps=>{ const html=UI.bridge(steps,o); if(n!==steps.length){ host.innerHTML=html; n=steps.length; return; }
    const tmp=el('div',null,html); const a=host.querySelectorAll('.br-row'), b=tmp.querySelectorAll('.br-row');
    b.forEach((r,i)=>{ const o=a[i]; if(!o) return; o.className=r.className;
      if(r.classList.contains('br-axis')){ o.querySelector('.br-t').innerHTML=r.querySelector('.br-t').innerHTML; return; }
      o.dataset.tip=r.dataset.tip; o.querySelector('.br-l').innerHTML=r.querySelector('.br-l').innerHTML; o.querySelector('.br-v').innerHTML=r.querySelector('.br-v').innerHTML;
      const ot=o.querySelector('.br-t'), rt=r.querySelector('.br-t'); ot.querySelectorAll('.br-g').forEach(x=>x.remove()); rt.querySelectorAll('.br-g').forEach(x=>ot.insertBefore(x.cloneNode(),ot.firstChild));
      const c=o.querySelector('.br-c'), d=rt.querySelector('.br-c'); c.className=d.className; c.style.left=d.style.left;
      const f=o.querySelector('.br-f'), g=rt.querySelector('.br-f'); f.className=g.className; f.style.left=g.style.left; f.style.width=g.style.width; }); }; },
  stat(label,value,tone='',sub=''){ return `<div class="stat ${tone}"><div class="stat-l">${label}</div><div class="stat-v">${value}</div>${sub?`<div class="stat-s">${sub}</div>`:''}</div>`; },
  table(head,rows,o={}){
    return `<div class="tbl"><table class="grid"><thead><tr>${head.map((h,i)=>`<th class="${(o.num||[]).includes(i)?'v':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.cls||''}">${(r.cells||r).map((c,i)=>`<td class="${(o.num||[]).includes(i)?'v':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
};

/* ---------- course outline */
const PARTS=[
  {name:'Foundations', n:1, mods:['m1','m2','m3','m4','m5']},
  {name:'Factory costs', n:2, mods:['m6','m7','m8']},
  {name:'Reports', n:3, mods:['m9','m10','m11']},
  {name:'Decisions', n:4, mods:['m12','m13','m14','m15']},
  {name:'Cash, risk and control', n:5, mods:['m16','m17','m18','m19','m20']},
  {name:'Real-world practice', n:6, mods:['m24','m21','m22']},
  {name:'Finish', n:null, mods:['cap']},
  {name:'Growing into a multinational', n:null, opt:true, note:'Optional, and not part of the capstone or the final assessment. Start with Module 24 when BraceWorks first sells or makes abroad; Modules 25 to 28 are for when it heads towards hundreds of people in several countries. They teach a GM how to build and oversee a group finance function, not how to do the CFO\'s job.', mods:['m23','m25','m26','m27','m28']}
];
const OUT={
  m1:{n:1,short:'Three statements',title:'The three statements',about:"BraceWorks' year as three pictures: profit, position and cash. How one sale shows up in all three."},
  m2:{n:2,short:'Bookkeeping',title:'Bookkeeping basics',about:'The accounting equation, debits and credits, and the journal. You post a month of transactions and build a trial balance.'},
  m3:{n:3,short:'Income statement',title:'The income statement',about:'Revenue, cost of goods sold, gross margin, overheads and EBITDA. Reading a P&L line by line and spotting where profit leaks.'},
  m4:{n:4,short:'Balance sheet',title:'The balance sheet',about:'What BraceWorks owns and owes: receivables, inventory, equipment, loans and equity, and what each tells a GM.'},
  m5:{n:5,short:'Cash flow',title:'Cash flow',about:'Why profit is not cash. The cash flow statement, the profit-to-cash bridge, and how a profitable firm runs dry.'},
  m6:{n:6,short:'Product costing',title:'Product costing',about:'The true cost of one mattress, sling and brace. Materials, labour and overhead, and how overhead gets spread.'},

  m10:{n:10,short:'Beyond statements',title:'Reports beyond the statements',about:'Aging reports, margin by product and customer, order backlog, scrap and yield, and the 13-week cash forecast.'},

  m12:{n:12,short:'Break-even & pricing',title:'Break-even and pricing',about:'Fixed and variable costs, contribution margin, break-even, and pricing an export quote that actually makes money.'},
  m13:{n:13,short:'Big decisions',title:'Product, customer and sourcing decisions',about:'Make or buy, special orders, which products and customers to grow or drop, and working around a bottleneck.'},
  m14:{n:14,short:'Investing',title:'Investing in equipment',about:'Payback, NPV and IRR in plain words. Deciding whether a $60,000 machine earns its keep.'},
  m15:{n:15,short:'Budgeting',title:'Budgeting and forecasting',about:'Building an annual budget from sales to cash, budget-vs-actual reviews, and rolling forecasts.'},
  m16:{n:16,short:'Working capital',title:'Working capital',about:'The cash conversion cycle, and the levers that free cash from receivables, inventory and payables.'},
  m17:{n:17,short:'Export finance',title:'Export finance',about:'Currency risk, Incoterms and their cost, letters of credit, trade finance, bank loans and covenants.'},
  m18:{n:18,short:'Controls',title:'Controls, audits and stakeholders',about:'Fraud and error warning signs, controls for a 50-person firm, working with auditors, and talking to banks and owners.'},
  m19:{n:19,short:'Tax',title:'Tax for exporters',about:'The logic behind tax rules, taxable vs accounting profit, VAT refunds and cash, cross-border traps, and country notes for the Philippines, Taiwan, China, the US and the UK.'},
  m22:{n:23,short:'Forecast model',title:'Building a three-statement forecast',about:'Link profit, balance sheet and cash in one forecast, check that it balances, and stress-test a plan before you commit.'},
  m23:{n:24,short:'Going abroad',title:'Opening a sales office or factory abroad',about:'Permanent establishment, transfer pricing, setting up a company, group accounts, moving cash home, and the factory business case.'},
  m24:{n:21,short:'Judgement calls',title:'The judgement calls behind the numbers',about:'Revenue timing, capitalising costs, warranty and recall provisions, currency revaluation, leases, deferred tax and the rulebooks your accounts follow, including the IFRS 18 layout from 2027.'},

  m20:{n:20,short:'Funding & value',title:'Funding and value',about:'Funding sources, debt capacity, cost of capital, sustainable growth and dividends, and what drives the value of the business.'},
  cap:{n:'C',short:'Capstone',title:'Capstone',about:'Run BraceWorks for a simulated year, then play detective on a year-end pack with problems hidden in it.'}
};
const ORDER=PARTS.flatMap(p=>p.mods);
/* Module and part names: the English above is kept pristine; BW.OUTSTR[lang] (src/ui_strings.js) overrides it per language. */
const OUT_EN={}; Object.keys(OUT).forEach(id=>{ const o=OUT[id]; OUT_EN[id]={n:o.n,short:o.short,title:o.title,about:o.about}; });
const PARTS_EN=PARTS.map(p=>({name:p.name,note:p.note}));
function applyOutStr(L){
  const o=(BW.OUTSTR&&BW.OUTSTR[L])||{}, pick=(t,e)=>(t!=null&&t!=='')?t:e;

function fsHTML(o){
  const cols=o.cols; let h='<div class="fs-wrap"><table class="fs">';
  if(o.title) h+=`<caption>${o.title}${o.sub?`<small>${o.sub}</small>`:''}</caption>`;
  if(cols) h+='<thead><tr><th></th>'+cols.map(c=>`<th class="v">${c}</th>`).join('')+'</tr></thead>';
  h+='<tbody>';
  o.rows.forEach(r=>{
    if(typeof r==='string'){ h+=`<tr class="grp"><th colspan="${(cols?cols.length:1)+1}">${r}</th></tr>`; return; }
    const [label,val,cls='']=r; const vals=Array.isArray(val)?val:[val];
    h+=`<tr class="${cls}"><th scope="row">${label}</th>`+vals.map(v=>`<td class="v">${v===null||v===undefined?'':typeof v==='number'?(o.fmt?o.fmt(v):money(v)):v}</td>`).join('')+'</tr>';
  });
  h+='</tbody></table></div>'; if(o.note) h+=`<p class="fs-note">${o.note}</p>`; return h;
}

function quizEl(b,key){
  const box=el('div','quiz'); const opts=b.opts.map(o=>typeof o==='string'?{text:o}:o);
  box.innerHTML=`<div class="quiz-q"><span class="quiz-tag">${T('Question')}</span><p>${b.q}</p></div><div class="quiz-opts"></div><div class="quiz-why" hidden></div>`;
  const oe=box.querySelector('.quiz-opts'), why=box.querySelector('.quiz-why'); const btns=[];
  opts.forEach((o,j)=>{ const bt=el('button','opt',`<span class="ol">${'ABCDEF'[j]}</span><span>${o.text}</span>`); bt.type='button'; bt.onclick=()=>{ S.quiz[key]=j; save(); show(j); refreshProgress(); }; oe.appendChild(bt); btns.push(bt); });

    const right=c===b.a;
    btns.forEach((bt,j)=>{ bt.disabled=true; bt.classList.toggle('is-right',j===b.a); bt.classList.toggle('is-wrong',j===c&&!right); bt.classList.toggle('is-dim',j!==b.a&&j!==c); });
    why.hidden=false; why.innerHTML=`<p><strong>${right?T('Correct.'):T('Not quite.')}</strong> ${opts[c].why?opts[c].why+' ':''}${b.why||''}</p>`;
    const r=el('button','linkbtn',T('Try this question again')); r.type='button'; r.onclick=()=>{ delete S.quiz[key]; save(); btns.forEach(bt=>{bt.disabled=false;bt.className='opt';}); why.hidden=true; refreshProgress(); }; why.appendChild(r);

function sortEl(b,key){
  const box=el('div','sort'); box.innerHTML=`<div class="sort-head"><p>${b.prompt}</p><span class="sort-score"></span></div>`;
  const score=box.querySelector('.sort-score');
  function upd(){ let a=0,r=0; b.items.forEach((it,j)=>{ const v=S.sorts[key+'.'+j]; if(v!==undefined){a++; if(v===it.a) r++;} }); score.textContent=a?T('{right} of {done} right · {left} to go',{right:r,done:a,left:b.items.length-a}):T('{n} to sort',{n:b.items.length}); }

    const row=el('div','sort-item'); row.innerHTML=`<div class="sort-text">${it.text}</div>`; const bb=el('div','sort-btns'); const fb=el('div','sort-fb'); fb.hidden=true;
    const btns=b.buckets.map((bk,k)=>{ const x=el('button','sb',bk); x.type='button'; x.onclick=()=>{ S.sorts[key+'.'+j]=k; save(); mark(k); upd(); }; bb.appendChild(x); return x; });
    function mark(k){ btns.forEach((x,q)=>{ x.disabled=true; x.classList.toggle('is-right',q===k&&k===it.a); x.classList.toggle('is-wrong',q===k&&k!==it.a); x.classList.toggle('is-ans',q===it.a&&k!==it.a); }); fb.hidden=false; fb.innerHTML=(k===it.a?`<strong class="pos">${T('Right.')}</strong> `:`<strong class="neg">${T('Answer: {answer}.',{answer:b.buckets[it.a]})}</strong> `)+(it.why||''); }
    row.appendChild(bb); row.appendChild(fb); box.appendChild(row);

function checkEl(b){

/* Link the first mention of each of this module's glossary terms in a section's reading text, so every
   defined word can be tapped for its definition. Skips headings, widgets, figures, tables and quizzes. */
function autoTerms(body,m){
  const G=BW.gloss; if(!m||!m.glossary) return;
  const have=new Set([...body.querySelectorAll('.term')].map(t=>{ const g=G.find(t.textContent); return g?g.term:''; }));
  const words=[]; m.glossary.forEach(g=>{ const e=G.find(g.term); if(!e||have.has(e.term)) return; const base=g.term.replace(/\s*\([^)]*\)\s*/g,' ').trim(); if(base.length>3||(base.length>=2&&/[\u3400-\u9fff]/.test(base))) words.push([base,e.term]); });
  if(!words.length) return; words.sort((a,b)=>b[0].length-a[0].length);
  const skip='.term,a,button,h1,h2,h3,h4,.widget,figure,table,.fs-wrap,.quiz,.q,.flip,.sort,.check,.co-label,label,code,.sec-head';
  const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement; if(!p||p.closest(skip)) return NodeFilter.FILTER_REJECT; return p.closest('.prose,.co')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  words.forEach(([w,term])=>{ const re=new RegExp('(^|[^\\w-])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:s|es)?)(?![\\w-])','i');
    for(let i=0;i<nodes.length;i++){ const n=nodes[i]; if(!n.parentNode||n.parentElement.closest('.term')) continue; const mm=re.exec(n.nodeValue); if(!mm) continue;
      const hit=n.splitText(mm.index+mm[1].length); const rest=hit.splitText(mm[2].length);
      const sp=document.createElement('span'); sp.className='term auto'; sp.dataset.g=term; sp.textContent=hit.nodeValue; hit.parentNode.replaceChild(sp,hit); nodes.push(rest); break; } });
}
function renderModule(main,m,mode){
  const isKit=mode==='kit'||mode==='pack', isPack=mode==='pack';
  { const mh=modHeader(m,mode); mh.dataset.cm=`${m.id}:_:0:h`; mh.id=`cm-${m.id}-x-0-h`; main.appendChild(mh); }
  if(!isKit){ const s=quizScore(m); const q=main.querySelector('#qs'); if(q&&s.n) q.textContent=T('{n} quiz questions',{n:s.n}); }
  const si=Math.min(cur.sec,m.sections.length-1); const sec=m.sections[si];

          const txt=b=>typeof b==='string'?b:(b&&[b.title,b.html,b.q,b.prompt,(b.cards||[]).map(c=>c.f+' '+c.b).join(' ')].filter(Boolean).join(' '))||'';
          const ix=m.sections.findIndex(sec=>sec.kind!=='quiz'&&sec.blocks.some(b=>{ const t=txt(b).toLowerCase(); return keys.some(k=>t.includes(k)); })); return ix<0?0:ix; };
        const draw=()=>{ const qq=q.trim().toLowerCase();
          const list=L.filter(e=> qq? (e.term.toLowerCase().includes(qq)||e.def.toLowerCase().includes(qq)||e.aka.some(a=>a.toLowerCase().includes(qq))) : (!letter||first(e)===letter));
          cnt.textContent=qq?(list.length===1?T('{n} match',{n:list.length}):T('{n} matches',{n:list.length})):letter?T('{n} terms under {letter}',{n:list.length,letter}):T('{n} terms',{n:list.length});
          dl.innerHTML=list.length?list.map((e,ix)=>`<div><dt>${e.term}</dt><dd>${e.def}${e.aka.length?`<div class="g-aka">${T('Also called: {names}',{names:e.aka.join(T(', '))})}</div>`:''}<div class="g-links">${T('Learn more:')} ${e.mods.map(id=>`<button type="button" class="linkbtn" data-m="${id}" data-i="${ix}">${T('{where}: {name}',{where:modName(OUT[id]),name:OUT[id].short})}</button>`).join(' · ')}</div></dd></div>`).join(''):`<div><dd>${T('No match. Try a shorter word, or a short form such as "AR" or "WIP".')}</dd></div>`;
          dl.querySelectorAll('[data-m]').forEach(b=>{ b.onclick=()=>{ const e=list[+b.dataset.i]; go(b.dataset.m,secFor(b.dataset.m,e),{jump:true}); }; }); };
        inp.addEventListener('input',()=>{ q=inp.value; if(q){ letter=''; az.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false')); } draw(); });
        draw(); }}]}
    ].concat(BW.kitExtra||[])};
}

function validId(id){ return id==='home'||id==='kit'||id==='packs'||!!OUT[id]||!!BW.packs[id]; }
const THEME_KEY='gmledger.theme';
function applyTheme(t){ const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); themeLabel(t); }
function themeLabel(t){ const b=document.getElementById('theme'); if(b){ b.innerHTML=`<span class="sw" aria-hidden="true"></span>${t==='light'?T('Light'):t==='dark'?T('Dark'):T('Auto')}`; b.title=T('Colour mode: {mode}. Tap to change.',{mode:t==='light'?T('light'):t==='dark'?T('dark'):T('auto')}); } }
function initTheme(){ let t='light'; try{ const v=localStorage.getItem(THEME_KEY); if(v==='light'||v==='dark'||v==='auto') t=v; }catch(e){} applyTheme(t);
  document.getElementById('theme').onclick=()=>{ const order=['light','dark','auto']; const curT=(document.documentElement.getAttribute('data-theme')||'auto'); const n=order[(order.indexOf(curT)+1)%3]; try{ localStorage.setItem(THEME_KEY,n); }catch(e){} applyTheme(n); }; }

/* ---------- contents panel, text size, scroll fades */
const SIZE_KEY='gmledger.size';
function applySize(v){ const r=document.documentElement; if(v==='lg') r.setAttribute('data-size','lg'); else r.removeAttribute('data-size'); }
function initSize(){ let v=''; try{ v=localStorage.getItem(SIZE_KEY)||''; }catch(e){} applySize(v); }
let tocEl=null, tocLast=null;
function closeToc(){ if(!tocEl) return; tocEl.remove(); tocEl=null; document.body.classList.remove('toc-open'); document.removeEventListener('keydown',tocKey); if(tocLast&&tocLast.focus) tocLast.focus(); }
function tocKey(e){ if(e.key==='Escape') closeToc(); }
function openToc(){
  if(tocEl){ closeToc(); return; }
  tocLast=document.activeElement;
  const built=ORDER.filter(id=>BW.mods[id]);
  const done=CORE.filter(id=>BW.mods[id]&&modPct(BW.mods[id])===1).length;
  const resume=S.last?S.last.match(/^(cap|m\d{1,2})-(\d+)$/):null;
  const wrap=el('div','toc'); wrap.id='toc'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true'); wrap.setAttribute('aria-label',T('Contents'));
  const size=document.documentElement.getAttribute('data-size')==='lg'?'lg':'';
  const theme=document.documentElement.getAttribute('data-theme')||'auto';
  let h=`<div class="toc-scrim" data-close></div><div class="toc-panel"><div class="toc-head"><h2>${T('Contents')}</h2><button type="button" class="toc-x" data-close aria-label="${esc(T('Close contents'))}">✕</button></div><div class="toc-body">
    <div class="toc-prog"><div class="toc-prog-t">${T('<b>{done} of {total}</b> complete: {n} modules and the capstone',{done,total:CORE.length,n:NMOD})}</div><div class="toc-bar" aria-hidden="true"><i style="width:${(done/CORE.length*100).toFixed(1)}%"></i></div>
    ${resume&&BW.mods[resume[1]]?`<button type="button" class="btn small toc-resume" data-go="${resume[1]}" data-sec="${parseInt(resume[2],10)-1}">${T('Continue: {where}, {section}',{where:modName(OUT[resume[1]]),section:esc0(BW.mods[resume[1]].sections[Math.min(parseInt(resume[2],10)-1,BW.mods[resume[1]].sections.length-1)].label)})}</button>`:''}</div>
    <button type="button" class="toc-row toc-home ${cur.id==='home'?'is-cur':''}" data-go="home"><span class="toc-n">⌂</span><span class="toc-t">${T('Course home')}</span></button>`;
  PARTS.forEach(p=>{
    h+=`<div class="toc-part${p.opt?' is-opt':''}"><h3>${p.n?T('Part {n}: {name}',{n:p.n,name:p.name}):p.name}</h3>`;
    p.mods.forEach(id=>{ const o=OUT[id], m=BW.mods[id]; const pc=modPct(m);
      h+=`<button type="button" class="toc-row ${cur.id===id?'is-cur':''} ${pc===1?'is-done':''}" data-go="${id}"${cur.id===id?' aria-current="page"':''}><span class="toc-n">${pc===1?'✓':o.n}</span><span class="toc-t">${o.title}</span><span class="toc-s">${!m?'':pc===1?T('Done'):pc>0?`<span class="toc-mini"><i style="width:${Math.round(pc*100)}%"></i></span>`:T('{n} min',{n:m.minutes})}</span></button>`; });
    h+='</div>'; });
  h+=`<div class="toc-part"><h3>${T('Reference')}</h3>
    <button type="button" class="toc-row" data-go="packs"><span class="toc-n">P</span><span class="toc-t">${T('Practice packs')}</span></button>
    <button type="button" class="toc-row" data-go="kit" data-sec="0"><span class="toc-n">T</span><span class="toc-t">${T('Toolkit: warning signs, formulas, templates, questions')}</span></button>
    <button type="button" class="toc-row" data-go="kit" data-sec="2"><span class="toc-n">G</span><span class="toc-t">${T('Glossary')}</span></button></div>
    <div class="toc-part toc-disp"><h3>${T('Display')}</h3>
      <div class="toc-set"><span id="tsz-l">${T('Text size')}</span><div class="seg2" role="group" aria-labelledby="tsz-l"><button type="button" data-size="" aria-pressed="${size===''}">${T('Standard')}</button><button type="button" data-size="lg" aria-pressed="${size==='lg'}">${T('Larger')}</button></div></div>
      <div class="toc-set"><span id="tth-l">${T('Colours')}</span><div class="seg2" role="group" aria-labelledby="tth-l">${['light','dark','auto'].map(t=>`<button type="button" data-th="${t}" aria-pressed="${theme===t}">${t==='light'?T('Light'):t==='dark'?T('Dark'):T('Match device')}</button>`).join('')}</div></div>
    </div></div></div>`;
  wrap.innerHTML=h; document.body.appendChild(wrap); tocEl=wrap; document.body.classList.add('toc-open');
  wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeToc);
  wrap.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const id=b.dataset.go, sec=b.dataset.sec!=null?+b.dataset.sec:0; closeToc(); go(id,sec,{jump:true}); });
  wrap.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ const v=b.dataset.size; try{ localStorage.setItem(SIZE_KEY,v); }catch(e){} applySize(v); wrap.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
  wrap.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{ const v=b.dataset.th; try{ localStorage.setItem(THEME_KEY,v); }catch(e){} applyTheme(v); wrap.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
  document.addEventListener('keydown',tocKey);
  const curRow=wrap.querySelector('.toc-row.is-cur'); if(curRow&&curRow.scrollIntoView) try{ curRow.scrollIntoView({block:'center'}); }catch(e){}
  wrap.querySelector('.toc-x').focus();
}
function esc0(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
BW.openToc=openToc;
function fadeEdges(sc){ if(!sc) return; const upd=()=>{ const max=sc.scrollWidth-sc.clientWidth; sc.classList.toggle('fade-l',sc.scrollLeft>4); sc.classList.toggle('fade-r',sc.scrollLeft<max-4); }; if(!sc._fade){ sc.addEventListener('scroll',upd,{passive:true}); window.addEventListener('resize',upd); sc._fade=1; } requestAnimationFrame(upd); }
BW.fadeEdges=fadeEdges;
function initToc(){ const b=document.getElementById('tocbtn'); if(b) b.onclick=openToc; }
let pop=null;
function hidePop(){ if(pop) pop.hidden=true; }
function showPop(t){ const e=BW.gloss&&BW.gloss.find(t.dataset.g||t.textContent); if(!e) return;
  if(!pop){ pop=document.createElement('div'); pop.className='gpop'; pop.setAttribute('role','dialog'); pop.hidden=true; document.body.appendChild(pop); }
  pop.innerHTML=`<div class="gp-t">${e.term}</div><div class="gp-d">${e.def}</div><button type="button" class="linkbtn">${T('Open in the glossary')}</button>`;
  pop.querySelector('button').onclick=()=>{ BW.glossQuery=e.term.replace(/\s*\([^)]*\)/g,'').trim(); go('kit',2,{jump:true}); };
  pop.hidden=false; const r=t.getBoundingClientRect(), pr=pop.getBoundingClientRect();
  let x=Math.min(Math.max(12,r.left),window.innerWidth-pr.width-12), y=r.bottom+8; if(y+pr.height>window.innerHeight-12) y=Math.max(12,r.top-pr.height-8);
  pop.style.left=x+'px'; pop.style.top=y+'px'; }
function initGloss(){
  document.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('.has-def'); if(t){ showPop(t); return; } if(!(e.target.closest&&e.target.closest('.gpop'))) hidePop(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hidePop(); const t=e.target.closest&&e.target.closest('.has-def'); if(t&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); showPop(t); } });
  window.addEventListener('scroll',hidePop,{passive:true});
}
function initTips(){
  const tip=document.createElement('div'); tip.className='vtip'; tip.hidden=true; document.body.appendChild(tip);
  let cur=null;
  const show=(t,x,y)=>{ const parts=String(t).split('|'); tip.innerHTML='<b>'+parts[0]+'</b>'+parts.slice(1).join('<br>'); tip.hidden=false; const r=tip.getBoundingClientRect(); let nx=x+14, ny=y+14; if(nx+r.width>window.innerWidth-8) nx=x-r.width-14; if(ny+r.height>window.innerHeight-8) ny=y-r.height-14; tip.style.left=Math.max(8,nx)+'px'; tip.style.top=Math.max(8,ny)+'px'; };
  document.addEventListener('pointermove',e=>{ const t=e.target&&e.target.closest?e.target.closest('[data-tip]'):null; if(!t){ if(cur){ tip.hidden=true; cur=null; } return; } cur=t; show(t.getAttribute('data-tip'),e.clientX,e.clientY); },{passive:true});
  document.addEventListener('pointerleave',()=>{ tip.hidden=true; cur=null; });
  window.addEventListener('scroll',()=>{ if(cur){ tip.hidden=true; cur=null; } },{passive:true});
}
/* ---------- language switcher: swaps the content registry and interface strings, then redraws the same page.
   Saved progress is keyed by module id, section id and block index, so it carries across languages. */
const LANG_KEY='gmledger.lang';
function setLang(L){
  if(!BW.LANG[L]) L='en';
  try{ localStorage.setItem(LANG_KEY,L); }catch(e){}
  if(L===BW.lang) return;
  closeToc(); hidePop();
  BW.useLang(L);
  if(!validId(cur.id)) cur={id:'home',sec:0};
  const y=window.scrollY||0; render(); try{ window.scrollTo(0,y); }catch(e){}
}
BW.setLang=setLang;
function initLang(){
  const s=document.getElementById('lang'); if(!s) return;
  [...s.options].forEach(o=>{ if(!BW.LANG[o.value]) o.remove(); });
  if(s.options.length<2){ s.parentNode.style.display='none'; return; }
  s.value=BW.lang; s.onchange=()=>setLang(s.value);
}
BW.onLang(()=>{ themeLabel(document.documentElement.getAttribute('data-theme')||'auto'); });
BW.boot=function(){
  initTheme(); initSize(); initToc(); initTips(); initGloss(); initLang();
  const h=parseHash(); if(h&&validId(h.id)) cur=h;
  document.getElementById('brand').onclick=()=>go('home');
  window.addEventListener('hashchange',()=>{ const x=parseHash(); if(x&&(x.id!==cur.id||x.sec!==cur.sec)&&validId(x.id)){ cur=x; render(); window.scrollTo(0,0);} });
  render();
};
})();
